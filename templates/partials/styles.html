<style>
    /* MetricPulse design tokens and base styles (docs/ui-redesign-scope.md §6, milestone U1).
       The category standard at Linear / Stripe-dashboard craft: neutral greys, white panels,
       near-black ink, one restrained accent, system type, hairline borders.
       Dark tokens are defined now but only apply once <html> carries .dark-ready, which U3 adds
       when no partial still uses light-only utility classes. */
    :root {
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-2: #f1f2f4;
        --border: #e3e4e8;
        --border-strong: #cfd1d6;
        --ink: #111317;
        --ink-2: #3b3f47;
        --ink-3: #636874;
        --accent: #2a5bd7;
        --accent-hover: #1f4bbf;
        --accent-soft: #e8eefc;
        --on-ink: #ffffff;
        --focus: #2a5bd7;
        --selection: #cddaf8;

        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 15px;
        --text-lg: 17px;
        --text-xl: 22px;
        --text-2xl: 28px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;

        --radius-sm: 6px;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 2px rgba(17, 19, 23, 0.06);
        --shadow-md: 0 4px 12px rgba(17, 19, 23, 0.08), 0 1px 3px rgba(17, 19, 23, 0.06);
        --shadow-tile: 0 1px 2px rgba(17, 19, 23, 0.05), 0 8px 24px -8px rgba(17, 19, 23, 0.14);
        /* Diverging pair for rose/fell, blue <-> red with a grey midpoint (dataviz reference palette;
           validate_palette.js passes on #ffffff: CVD dE 21.6, normal 32.3, contrast >= 3:1). */
        --rise: #2a78d6;
        --fall: #e34948;
        --diverge-mid: #f0efec;
        --gap-tiles: 28px;
        --page-max: 1200px;
        --header-h: 56px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
        :root.dark-ready {
            --canvas: #0d0e11;
            --surface: #15171b;
            --surface-2: #1c1f24;
            --border: #272a31;
            --border-strong: #363a42;
            --ink: #eceef1;
            --ink-2: #c4c7ce;
            --ink-3: #9096a1;
            --accent: #7c9fff;
            --accent-hover: #9cb6ff;
            --accent-soft: #1b2440;
            --on-ink: #0d0e11;
            --focus: #7c9fff;
            --selection: #2a3a66;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
            --shadow-tile: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
            --rise: #3987e5;      /* validated on #15171b: CVD dE 19.2, contrast >= 3:1 */
            --fall: #e66767;
            --diverge-mid: #383835;
            color-scheme: dark;
        }
    }

    /* --- base: a small reset (what the page relied on from Tailwind's preflight before U3) --- */
    *, *::before, *::after { box-sizing: border-box; border: 0 solid var(--border); }
    h1, h2, h3, h4, h5, h6, p, blockquote, dl, dd, figure, pre, hr { margin: 0; }
    h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
    ul, ol, menu { list-style: none; margin: 0; padding: 0; }
    button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
    button { background: transparent; cursor: pointer; }
    table { border-collapse: collapse; }
    img, svg, canvas { display: block; max-width: 100%; }
    summary { cursor: pointer; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: var(--text-base);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }
    ::selection { background: var(--selection); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }
    a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
    a:hover { text-decoration: underline; }
    code, kbd, samp, .mono { font-family: var(--font-mono); font-size: 0.92em; }
    .num, table { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .visually-hidden {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    * { scrollbar-color: var(--border-strong) transparent; scrollbar-width: thin; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid var(--canvas); }
    ::-webkit-scrollbar-track { background: transparent; }

    .page { max-width: var(--page-max); margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-8); }
    @media (max-width: 640px) { .page { padding: var(--space-5) var(--space-4) var(--space-7); } }

    /* --- header and tabs --- */
    .site-header {
        position: sticky; top: 0; z-index: 40;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: saturate(1.4) blur(10px);
        -webkit-backdrop-filter: saturate(1.4) blur(10px);
        border-bottom: 1px solid var(--border);
    }
    .site-header-inner {
        max-width: var(--page-max); margin: 0 auto; padding: 0 var(--space-5);
        min-height: var(--header-h); display: flex; align-items: center; gap: var(--space-5);
    }
    .wordmark {
        display: inline-flex; align-items: center; gap: var(--space-2);
        color: var(--ink); font-weight: 650; font-size: var(--text-base); letter-spacing: -0.01em;
        background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
    }
    .wordmark:hover { text-decoration: none; }
    .wordmark svg { display: block; }
    .site-nav { display: flex; gap: 2px; flex: 1; min-width: 0; }
    .nav-tab {
        appearance: none; border: 0; background: transparent; cursor: pointer;
        font: inherit; font-size: var(--text-sm); font-weight: 500; color: var(--ink-3);
        padding: 6px 10px; border-radius: var(--radius-sm); white-space: nowrap;
        transition: color 120ms var(--ease-out), background-color 120ms var(--ease-out);
    }
    .nav-tab:hover { color: var(--ink); background: var(--surface-2); }
    .nav-tab.tab-active { color: var(--ink); background: var(--surface-2); }
    .nav-tab.opacity-80 { opacity: 1; }   /* scripts.html's legacy toggle; the active state is the background */
    .header-actions { display: flex; align-items: center; gap: var(--space-2); }

    @media (max-width: 760px) {
        .site-header-inner { flex-wrap: wrap; row-gap: 0; padding: var(--space-2) var(--space-4) 0; }
        .site-nav {
            order: 3; flex-basis: 100%; overflow-x: auto; padding-bottom: var(--space-2);
            scrollbar-width: none; margin: 0 calc(-1 * var(--space-4)); padding-left: var(--space-4); padding-right: var(--space-4);
        }
        .site-nav::-webkit-scrollbar { display: none; }
        .header-actions { margin-left: auto; }
    }

    /* --- buttons --- */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
        font: inherit; font-size: var(--text-sm); font-weight: 550; line-height: 1;
        padding: 9px 14px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer;
        transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out), color 120ms var(--ease-out);
        white-space: nowrap;
    }
    .btn:hover { text-decoration: none; }
    .btn svg { flex: none; }
    .btn-primary { background: var(--ink); color: var(--on-ink); }
    .btn-primary:hover { background: var(--ink-2); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn-quiet { background: transparent; color: var(--ink-2); }
    .btn-quiet:hover { background: var(--surface-2); color: var(--ink); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 420px) { .btn-label-long { display: none; } }

    /* --- panels and type --- */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .panel-body { padding: var(--space-5); }
    .page-title { font-size: var(--text-2xl); line-height: 1.2; font-weight: 650; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
    .section-title { font-size: var(--text-lg); line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 var(--space-3); }
    .label { font-size: var(--text-xs); font-weight: 600; color: var(--ink-3); margin: 0 0 var(--space-2); }
    .muted { color: var(--ink-3); }
    .lede { font-size: var(--text-lg); color: var(--ink-2); max-width: 62ch; margin: var(--space-3) 0 0; text-wrap: pretty; }
    .rule { border: 0; border-top: 1px solid var(--border); margin: var(--space-6) 0; }

    /* --- tiles (elevated panels) --- */
    .tile {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
        box-shadow: var(--shadow-tile);
    }
    .tile-pad { padding: var(--space-5); }
    .page > section + section { margin-top: var(--gap-tiles); }   /* stacked sections only, never grid cells */
    .tile-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-4); }
    .tile-head .section-title { margin-bottom: 2px; }
    .tile-sub { margin: 0 0 var(--space-4); font-size: var(--text-sm); }
    .tile-head .tile-sub { margin: 0; }
    .tile-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .subhead { font-size: var(--text-base); font-weight: 600; margin: 0 0 2px; }
    .link-btn { appearance: none; display: inline; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
    .link-btn:hover { text-decoration: underline; }

    /* --- intro --- */
    .page > .intro + section { margin-top: var(--space-7); }
    .intro-title { font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.025em; }
    .flow { list-style: none; padding: 0; margin: var(--space-5) 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); }
    .flow li { padding: var(--space-4) var(--space-4) 0 0; display: flex; flex-direction: column; gap: 2px; position: relative; }
    .flow li + li { padding-left: var(--space-4); border-left: 1px solid var(--border); }
    .flow strong { font-size: var(--text-sm); font-weight: 600; color: var(--ink); }
    .flow span { font-size: var(--text-sm); color: var(--ink-3); }
    @media (max-width: 760px) {
        .flow { grid-template-columns: 1fr 1fr; row-gap: var(--space-4); }
        .flow li:nth-child(3) { padding-left: 0; border-left: 0; }
    }
    .intro-meta { margin: var(--space-5) 0 0; font-size: var(--text-sm); color: var(--ink-3); max-width: 75ch; }

    /* --- filters --- */
    .filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: var(--space-4); align-items: end; margin-top: var(--space-5); padding-top: var(--space-5); border-top: 1px solid var(--border); }
    @media (max-width: 960px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filters-actions { grid-column: 1 / -1; } }
    @media (max-width: 480px) { .filters { grid-template-columns: 1fr; } }
    .field .label { display: block; }
    .input {
        width: 100%; font: inherit; font-size: var(--text-sm); color: var(--ink); background: var(--surface);
        border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 8px 10px; min-height: 36px;
    }
    .input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .range-row { display: flex; align-items: center; gap: var(--space-3); min-height: 36px; }
    .range { flex: 1; accent-color: var(--ink); }
    .range-value { font-size: var(--text-sm); font-weight: 600; color: var(--ink); min-width: 3.2em; text-align: right; }
    .filters-actions { display: flex; gap: var(--space-2); }

    /* --- kpis --- */
    .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap-tiles); }
    @media (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
    .kpi { padding: var(--space-5); }
    .kpi .label { margin: 0; }
    .kpi-value { font-size: var(--text-2xl); font-weight: 650; letter-spacing: -0.02em; margin: var(--space-2) 0 var(--space-2); line-height: 1.1; }
    .kpi-change, .kpi-note { margin: 0; font-size: var(--text-sm); }
    .kpi-note { color: var(--ink-3); }
    .delta { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .delta svg { flex: none; }
    .delta-up svg { color: var(--rise); }
    .delta-down svg { color: var(--fall); }
    .delta-note { color: var(--ink-3); margin-left: var(--space-2); }

    /* --- chart --- */
    .segmented { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: var(--radius); gap: 2px; }
    .seg-btn { appearance: none; border: 0; background: transparent; font: inherit; font-size: var(--text-sm); font-weight: 500; color: var(--ink-3); padding: 5px 12px; border-radius: var(--radius-sm); cursor: pointer; }
    .seg-btn:hover { color: var(--ink); }
    .seg-btn.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
    .chart-box { position: relative; }

    /* --- breakdowns --- */
    .breakdowns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); }
    @media (max-width: 760px) { .breakdowns { grid-template-columns: 1fr; gap: var(--space-5); } }
    .breakdowns .subhead { margin-bottom: var(--space-3); }
    .bars { display: flex; flex-direction: column; gap: var(--space-3); }
    .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--space-3); align-items: baseline; }
    .bar-name { font-size: var(--text-sm); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-value { font-size: var(--text-sm); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .bar-track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; min-width: 2px; }
    .bar-fill.is-up { background: var(--rise); }
    .bar-fill.is-down { background: var(--fall); }
    .bars-note { font-size: var(--text-xs); color: var(--ink-3); margin: var(--space-4) 0 0; }
    .bars-note:empty { display: none; }
    .legend { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--ink-2); }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .swatch-rise { background: var(--rise); }
    .swatch-fall { background: var(--fall); }

    /* --- flagged days --- */
    .day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .day-chip {
        appearance: none; font: inherit; font-size: var(--text-sm); cursor: pointer; text-align: left;
        display: inline-flex; flex-direction: column; gap: 1px; padding: 7px 12px; border-radius: var(--radius);
        background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong);
        transition: border-color 120ms var(--ease-out), background-color 120ms var(--ease-out);
    }
    .day-chip:hover { background: var(--surface-2); }
    .day-chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .day-chip strong { font-weight: 600; font-variant-numeric: tabular-nums; }
    .day-chip span { font-size: var(--text-xs); color: var(--ink-3); }

    /* --- narrative and investigation --- */
    .prose-box { background: var(--surface-2); border-radius: var(--radius); padding: var(--space-4) var(--space-5); color: var(--ink-2); line-height: 1.65; max-width: 100%; }
    .prose-box strong { color: var(--ink); font-weight: 600; }
    .prose-box hr { border: 0; border-top: 1px solid var(--border); margin: var(--space-3) 0; }
    .prose-box em { color: var(--ink-3); font-style: normal; font-size: var(--text-sm); }
    .investigation { margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid var(--border); }
    .investigation .tile-sub { margin-bottom: var(--space-3); }

    /* --- run panel --- */
    .run-panel { display: grid; grid-template-columns: 1fr auto; gap: var(--space-3) var(--space-5); align-items: center; }
    .run-panel .tile-sub { margin: 0; }
    .run-status { grid-column: 1 / -1; font-size: var(--text-sm); }
    .run-status:empty { display: none; }
    @media (max-width: 640px) { .run-panel { grid-template-columns: 1fr; } }

    /* --- narrow pages (Overview, AI agents): one column, one reading line --- */
    .page-narrow { max-width: 960px; }
    .page-narrow > * + * { margin-top: var(--gap-tiles); }
    .page-doc > section + section, .page-doc > header + section { margin-top: var(--space-8); }   /* a long read: more space above each heading */

    /* --- Overview: intro and the answer, the one focal point --- */
    .overview-intro { max-width: 720px; }
    .overview-title { font-size: var(--text-lg); font-weight: 600; color: var(--ink-3); margin: 0; letter-spacing: -0.01em; }
    .overview-intro .lede { margin-top: var(--space-2); font-size: var(--text-base); color: var(--ink-2); }
    .page-narrow > .answer { margin-top: var(--space-6); }
    .answer { padding: var(--space-2) 0 var(--space-6); }
    .answer-headline { font-size: clamp(36px, 6vw, 64px); line-height: 1.02; font-weight: 700; letter-spacing: -0.035em; margin: 0; color: var(--ink); text-wrap: balance; }
    .answer-sub { font-size: var(--text-lg); color: var(--ink-2); margin: var(--space-3) 0 0; font-variant-numeric: tabular-nums; }
    .answer-drivers { font-size: var(--text-base); color: var(--ink-2); margin: var(--space-2) 0 0; max-width: 68ch; }
    .answer-drivers:empty { display: none; }
    .answer-stats { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin: var(--space-5) 0 0; padding: 0; }
    .answer-stats div { display: flex; align-items: baseline; gap: var(--space-2); }
    .answer-stats dt { font-size: var(--text-sm); color: var(--ink-3); }
    .answer-stats dd { margin: 0; font-size: var(--text-sm); font-weight: 600; color: var(--ink); display: inline-flex; gap: var(--space-2); align-items: baseline; }
    .answer-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-6); }
    .btn-lg { font-size: var(--text-base); padding: 12px 18px; }

    /* --- disclosures --- */
    .disclosure { border-top: 1px solid var(--border); margin-top: var(--space-5); padding-top: var(--space-4); }
    .disclosure summary { cursor: pointer; font-size: var(--text-sm); font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: var(--space-2); }
    .disclosure summary::-webkit-details-marker { display: none; }
    .disclosure summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 150ms var(--ease-out); }
    .disclosure[open] summary::before { transform: rotate(45deg); }
    .disclosure summary:hover { color: var(--ink); }
    .disclosure .filters { margin-top: var(--space-4); padding-top: 0; border-top: 0; }

    /* --- AI agents tab --- */
    .agents-intro .lede { font-size: var(--text-base); }
    .jump { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5); }
    .jump a { font-size: var(--text-sm); color: var(--ink-2); padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); }
    .jump a:hover { text-decoration: none; background: var(--surface-2); color: var(--ink); }
    .agent { scroll-margin-top: calc(var(--header-h) + var(--space-4)); padding-top: var(--space-6); border-top: 1px solid var(--border); }
    .page-narrow > .agent { margin-top: var(--space-7); }
    .agent-head { margin-bottom: var(--space-5); }
    .agent-what { color: var(--ink-2); max-width: 68ch; margin: var(--space-2) 0 0; }
    .score-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-4); margin: var(--space-5) 0 0; padding: 0; }
    .score-cell { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 2px; }
    .score-cell dt { font-size: var(--text-sm); color: var(--ink-2); line-height: 1.4; }
    .score-cell dd { margin: 0; }
    .score-figure { font-size: var(--text-2xl); font-weight: 650; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; }
    .score-context { display: block; font-size: var(--text-xs); color: var(--ink-3); }
    .score-meta { font-size: var(--text-xs); color: var(--ink-3); margin: var(--space-3) 0 0; }
    #agent-days { margin-bottom: var(--space-4); }
    .investigation { margin-top: var(--space-4); }

    /* --- approvals --- */
    .approvals-head { margin: var(--space-6) 0 var(--space-3); }
    .token-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }

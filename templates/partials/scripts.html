<script>
    // Tab switching
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('tab-active');
            el.removeAttribute('aria-current');
        });

        document.getElementById(`content-${tabName}`).classList.remove('hidden');
        const tabBtn = document.getElementById(`tab-${tabName}`);
        if (tabBtn) {
            tabBtn.classList.add('tab-active');
            tabBtn.setAttribute('aria-current', 'page');
        }
        
        // Load dashboard data when switching to dashboard
        if (tabName === 'dashboard' && metricsData.length === 0) {
            loadMetrics();
            loadAnomalies();
            loadDecomposition();
            loadNarrative();
        }
        
        // The actions tab reloads every time it opens: proposals expire and change state.
        if (tabName === 'actions') {
            loadActions();
        }

        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Investigate is the first screen (docs/ui-redesign-scope.md §5); open it once the page has
    // parsed, so every script below (and the static replay's fetch shim) is ready.
    document.addEventListener('DOMContentLoaded', () => showTab('dashboard'));

    // Shared helpers for the redesigned dashboard (docs/ui-redesign-scope.md §6).
    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function withAlpha(hex, alpha) {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return hex;
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    // Narratives are generated text (and segment names are untrusted, N3): escape first, then
    // render **bold**, *italic* and '---' rules. Emoji are dropped on display only; the recorded
    // output keeps them.
    function formatNarrative(text) {
        return escapeHtml(String(text || ''))
            .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]\uFE0F?\s?/gu, '')
            .split(/\n{2,}/)
            .map(block => block.trim() === '---' ? '<hr>' : `<p style="margin: 0 0 10px;">${block
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>')}</p>`)
            .join('');
    }

    // --- Days to look at (docs/ui-redesign-scope.md §5): the detector's flagged days, the
    // incomplete-data day, and (on the static replay) the recorded AI investigations, which
    // demo/static/replay.js puts in window.extraFlaggedDays.
    let lastDetection = null;
    const METRIC_NAMES = { total_revenue: 'revenue', order_count: 'orders', avg_order_value: 'AOV' };

    function flaggedDays() {
        const items = [...(window.extraFlaggedDays || [])];
        const d = lastDetection;
        if (d) {
            (d.all_anomalies || []).forEach(a => items.push({
                date: a.metric_date, metric: 'total_revenue',
                note: `z ${Number(a.zscore).toFixed(1)} \u00b7 ${a.anomaly_direction === 'low' ? 'unusually low' : 'unusually high'}`,
            }));
            if (d.freshness && d.freshness.status === 'stale' && d.freshness.date) {
                items.push({ date: d.freshness.date, metric: 'total_revenue',
                             note: `incomplete data \u00b7 ${d.freshness.volume} vs ~${Math.round(d.freshness.median)} usual` });
            }
        }
        const seen = new Set();
        return items.filter(i => { const k = i.date + i.metric + (i.investigate ? 'ai' : ''); if (seen.has(k)) return false; seen.add(k); return true; });
    }

    function formatDay(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    function renderFlaggedDays() {
        const list = document.getElementById('flagged-days');
        if (!list) return;
        const items = flaggedDays();
        if (!items.length) { list.innerHTML = '<li class="muted">Nothing flagged at this threshold. Lower it, or pick any pair below.</li>'; return; }
        const current = (document.getElementById('current-date') || {}).value;
        const metric = (document.getElementById('metric-select') || {}).value;
        list.innerHTML = items.map((item, i) => `
            <li><button type="button" class="day-chip" data-index="${i}" aria-pressed="${item.date === current && item.metric === metric}"
                        onclick="selectFlaggedDay(${i})">
                <strong>${escapeHtml(formatDay(item.date))} \u00b7 ${escapeHtml(METRIC_NAMES[item.metric] || item.metric)}</strong>
                <span>${escapeHtml(item.note)}</span>
            </button></li>`).join('');
    }

    function selectFlaggedDay(index) {
        const item = flaggedDays()[index];
        if (!item || !metricsData.length) return;
        const at = metricsData.findIndex(row => row.metric_date === item.date);
        const previous = item.previous_date || (metricsData[at + 1] || {}).metric_date;
        if (at < 0 || !previous) return;
        document.getElementById('current-date').value = item.date;
        document.getElementById('previous-date').value = previous;
        selectMetric(item.metric);
        applyFilters();
        if (item.investigate) investigateWithAgent();
        document.getElementById('kpi-revenue').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Dashboard functionality
    let metricsData = [];
    let decompositionData = null;
    let currentChart = null;
    let selectedMetric = 'total_revenue';

    function updateThresholdLabel(value) {
        document.getElementById('threshold-label').textContent = parseFloat(value).toFixed(1) + 'σ';
    }

    async function loadMetrics() {
        try {
            const response = await fetch('/api/metrics/?days=60');
            const result = await response.json();
            
            if (result.status === 'success' && result.data.length > 0) {
                metricsData = result.data;
                populateDateDropdowns(result.data);
                
                const latest = result.data[0];
                const previous = result.data[1] || latest;
                
                updateKPIs(latest, previous);
                drawChart(result.data.slice().reverse(), selectedMetric);
            }
        } catch (error) {
            console.error('Failed to load metrics:', error);
        }
    }

    function populateDateDropdowns(data) {
        const currentSelect = document.getElementById('current-date');
        const previousSelect = document.getElementById('previous-date');
        
        if (!currentSelect || !previousSelect) return;
        
        currentSelect.innerHTML = data.map((d, i) => 
            `<option value="${d.metric_date}" ${i === 0 ? 'selected' : ''}>${d.metric_date}</option>`
        ).join('');
        
        previousSelect.innerHTML = data.map((d, i) => 
            `<option value="${d.metric_date}" ${i === 1 ? 'selected' : ''}>${d.metric_date}</option>`
        ).join('');
    }

    function updateKPIs(latest, previous) {
        const revenueEl = document.getElementById('kpi-revenue');
        if (!revenueEl) return;
        
        revenueEl.textContent = '$' + parseFloat(latest.total_revenue).toLocaleString('en-US', {minimumFractionDigits: 2});
        const revChange = ((latest.total_revenue - previous.total_revenue) / previous.total_revenue * 100);
        setChangeLabel('kpi-revenue-change', revChange);
        
        document.getElementById('kpi-orders').textContent = parseInt(latest.order_count).toLocaleString();
        const ordChange = ((latest.order_count - previous.order_count) / previous.order_count * 100);
        setChangeLabel('kpi-orders-change', ordChange);
        
        document.getElementById('kpi-aov').textContent = '$' + parseFloat(latest.avg_order_value).toFixed(2);
        const aovChange = ((latest.avg_order_value - previous.avg_order_value) / previous.avg_order_value * 100);
        setChangeLabel('kpi-aov-change', aovChange);
    }

    function setChangeLabel(elementId, change) {
        const el = document.getElementById(elementId);
        if (!el) return;
        if (!isFinite(change)) { el.textContent = ''; return; }
        const up = change >= 0;
        const sign = up ? '+' : '\u2212';
        const tri = up ? 'M5 1 9 8H1z' : 'M5 9 1 2h8z';
        el.innerHTML = `<span class="delta ${up ? 'delta-up' : 'delta-down'}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="${tri}" fill="currentColor"/></svg>${sign}${Math.abs(change).toFixed(1)}%</span><span class="delta-note">vs compared day</span>`;
    }

    // Single series, so no legend box (the title names it); flagged days are 8px dots with a 2px
    // surface ring; the selected day is a ring; hover shows a crosshair and tooltip (dataviz skill).
    const crosshair = {
        id: 'crosshair',
        afterDatasetsDraw(chart) {
            const active = chart.tooltip && chart.tooltip.getActiveElements();
            if (!active || !active.length) return;
            const x = active[0].element.x, { top, bottom } = chart.chartArea, ctx = chart.ctx;
            ctx.save();
            ctx.strokeStyle = cssVar('--border-strong');
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
            ctx.restore();
        },
    };

    function drawChart(data, metric) {
        const canvas = document.getElementById('revenueChart');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        if (currentChart) currentChart.destroy();

        const labels = { 'total_revenue': 'Revenue', 'order_count': 'Orders', 'avg_order_value': 'Avg order value' };
        const prefix = metric === 'order_count' ? '' : '$';
        const flagged = new Set(flaggedDays().filter(i => i.metric === metric).map(i => i.date));   // this metric's flags only
        const selected = (document.getElementById('current-date') || {}).value;
        const accent = cssVar('--accent'), surface = cssVar('--surface'), ink = cssVar('--ink');
        const radius = data.map(d => d.metric_date === selected ? 6 : (flagged.has(d.metric_date) ? 4 : 0));

        currentChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.metric_date),
                datasets: [{
                    label: labels[metric],
                    data: data.map(d => d[metric]),
                    borderColor: accent,
                    backgroundColor: withAlpha(accent, 0.07),
                    fill: true,
                    tension: 0.3,
                    borderWidth: 2,
                    pointRadius: radius,
                    pointHoverRadius: 5,
                    pointHitRadius: 10,
                    pointBackgroundColor: data.map(d => d.metric_date === selected ? surface : (flagged.has(d.metric_date) ? ink : accent)),
                    pointBorderColor: data.map(d => d.metric_date === selected ? ink : surface),
                    pointBorderWidth: 2,
                }]
            },
            plugins: [crosshair],
            options: {
                responsive: true,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: cssVar('--surface'),
                        titleColor: cssVar('--ink'),
                        bodyColor: cssVar('--ink-2'),
                        borderColor: cssVar('--border'),
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        callbacks: {
                            title: items => formatDay(items[0].label) + (flagged.has(items[0].label) ? ' \u00b7 flagged' : ''),
                            label: item => `${labels[metric]}: ${prefix}${Number(item.raw).toLocaleString('en-US', { maximumFractionDigits: 2 })}`,
                        },
                    },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: value => prefix + value.toLocaleString(), color: cssVar('--ink-3'), font: { size: 12 }, maxTicksLimit: 5 },
                        grid: { color: cssVar('--border') },
                        border: { display: false }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: cssVar('--ink-3'), font: { size: 12 }, maxRotation: 0, autoSkipPadding: 24,
                                 callback: function (value) { return formatDay(this.getLabelForValue(value)).replace(/, \d{4}$/, ''); } },
                        border: { color: cssVar('--border') }
                    }
                }
            }
        });

        const chartTitle = document.getElementById('chart-title');
        if (chartTitle) chartTitle.textContent = labels[metric];
    }

    function setChartMetric(metric) {
        selectedMetric = metric;
        document.querySelectorAll('.chart-btn').forEach(btn => {
            btn.classList.toggle('is-active', btn.dataset.metric === metric);
        });
        drawChart(metricsData.slice().reverse(), metric);
    }

    function selectMetric(metric) {
        const metricSelect = document.getElementById('metric-select');
        if (metricSelect) metricSelect.value = metric;
        setChartMetric(metric);
    }

    async function loadAnomalies() {
        try {
            const thresholdSlider = document.getElementById('threshold-slider');
            const threshold = thresholdSlider ? thresholdSlider.value : 2;
            const response = await fetch(`/api/anomalies/?threshold=${threshold}`);
            const result = await response.json();
            
            if (result.status === 'success') {
                const anomaliesEl = document.getElementById('kpi-anomalies');
                if (anomaliesEl) anomaliesEl.textContent = result.data.anomaly_count;
                const echo = document.getElementById('threshold-echo');
                if (echo) echo.textContent = parseFloat(threshold).toFixed(1) + '\u03c3';
                lastDetection = result.data;
                renderFlaggedDays();
                if (metricsData.length) drawChart(metricsData.slice().reverse(), selectedMetric);
            }
        } catch (error) {
            console.error('Failed to load anomalies:', error);
        }
    }

    async function loadDecomposition() {
        try {
            const currentDateEl = document.getElementById('current-date');
            const previousDateEl = document.getElementById('previous-date');
            
            const currentDate = currentDateEl ? currentDateEl.value : '';
            const previousDate = previousDateEl ? previousDateEl.value : '';
            
            let url = '/api/decomposition/';
            if (currentDate && previousDate) {
                url += `?current_date=${currentDate}&previous_date=${previousDate}`;
            }
            
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.status === 'success') {
                decompositionData = result.data;
                const dims = result.data.dimensions;
                
                const scales = [
                    dims.geography && renderBreakdown('geo-breakdown', dims.geography.top_contributors),
                    dims.product && renderBreakdown('product-breakdown', dims.product.top_contributors),
                    dims.payment && renderBreakdown('payment-breakdown', dims.payment.top_contributors),
                ];
                const note = document.getElementById('bars-note');
                if (note) note.textContent = scales.some(x => x > 100)
                    ? 'A share above 100% means other segments in that dimension moved the opposite way; each column has its own scale.'
                    : 'Each column has its own scale.';
            }
        } catch (error) {
            console.error('Failed to load decomposition:', error);
        }
    }

    function renderBreakdown(elementId, contributors) {
        const container = document.getElementById(elementId);
        if (!container) return;
        const top = (contributors || []).slice(0, 5);
        if (!top.length) { container.innerHTML = '<p class="muted">No segments for this pair of days.</p>'; return; }
        // Bars share one scale: the largest share shown. Shares can exceed 100% or offset each
        // other (a segment can move against the total), so capping at 100% would misdraw them.
        const scale = Math.max(...top.map(c => Math.abs(c.contribution_pct)), 1);
        container.innerHTML = top.map(c => {
            // Colour says what the segment did (rose or fell); the number is its share of the
            // total change, negative when it moved against the total.
            const tone = c.change >= 0 ? 'is-up' : 'is-down';
            const sign = c.contribution_pct < 0 ? '\u2212' : '';
            const what = `${c.segment}: ${c.change >= 0 ? 'rose' : 'fell'} from ${c.previous_value} to ${c.current_value}, ${sign}${Math.abs(c.contribution_pct).toFixed(1)}% of the total change`;
            return `
            <div class="bar-row" title="${escapeHtml(what)}">
                <span class="bar-name" title="${escapeHtml(c.segment)}">${escapeHtml(c.segment)}</span>
                <span class="bar-value">${sign}${Math.abs(c.contribution_pct).toFixed(1)}%</span>
                <div class="bar-track"><div class="bar-fill ${tone}" style="width: ${(Math.abs(c.contribution_pct) / scale * 100).toFixed(1)}%"></div></div>
            </div>`;
        }).join('');
        return scale;
    }

    function toggleDrilldown(dimension) {
        const drilldown = document.getElementById(`${dimension}-drilldown`);
        const toggle = document.getElementById(`${dimension}-toggle`);
        
        if (!drilldown || !toggle) return;
        
        if (drilldown.classList.contains('hidden')) {
            drilldown.classList.remove('hidden');
            toggle.textContent = 'Hide';
        } else {
            drilldown.classList.add('hidden');
            toggle.textContent = 'Details';
        }
    }

    async function loadNarrative() {
        try {
            const currentDateEl = document.getElementById('current-date');
            const previousDateEl = document.getElementById('previous-date');
            
            const currentDate = currentDateEl ? currentDateEl.value : '';
            const previousDate = previousDateEl ? previousDateEl.value : '';
            
            let url = '/api/narrative/';
            if (currentDate && previousDate) {
                url += `?current_date=${currentDate}&previous_date=${previousDate}`;
            }
            
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.status === 'success') {
                const narrativeEl = document.getElementById('narrative');
                if (narrativeEl) {
                    narrativeEl.innerHTML = formatNarrative(result.data.full);
                }
            }
        } catch (error) {
            console.error('Failed to load narrative:', error);
        }
    }

    function applyFilters() {
        loadDecomposition();
        loadNarrative();
        loadAnomalies();
        
        const currentDateEl = document.getElementById('current-date');
        const previousDateEl = document.getElementById('previous-date');
        
        if (!currentDateEl || !previousDateEl) return;
        
        const currentDate = currentDateEl.value;
        const previousDate = previousDateEl.value;
        
        const current = metricsData.find(d => d.metric_date === currentDate);
        const previous = metricsData.find(d => d.metric_date === previousDate);
        
        if (current && previous) updateKPIs(current, previous);
        if (metricsData.length) drawChart(metricsData.slice().reverse(), selectedMetric);
        renderFlaggedDays();
    }

    function resetFilters() {
        const thresholdSlider = document.getElementById('threshold-slider');
        const thresholdLabel = document.getElementById('threshold-label');
        const metricSelect = document.getElementById('metric-select');
        
        if (thresholdSlider) thresholdSlider.value = 2;
        if (thresholdLabel) thresholdLabel.textContent = '2.0σ';
        if (metricSelect) metricSelect.value = 'total_revenue';
        
        if (metricsData.length >= 2) {
            const currentDateEl = document.getElementById('current-date');
            const previousDateEl = document.getElementById('previous-date');
            if (currentDateEl) currentDateEl.value = metricsData[0].metric_date;
            if (previousDateEl) previousDateEl.value = metricsData[1].metric_date;
        }
        
        setChartMetric('total_revenue');
        applyFilters();
    }

    function refreshData() {
        loadMetrics();
        loadAnomalies();
        loadDecomposition();
        loadNarrative();
    }

    function copyNarrative() {
        const narrativeEl = document.getElementById('narrative');
        if (!narrativeEl) return;
        const narrative = narrativeEl.innerText;
        const btn = document.activeElement;
        navigator.clipboard.writeText(narrative).then(() => {
            if (!btn || btn.tagName !== 'BUTTON') return;
            const label = btn.textContent;
            btn.textContent = 'Copied';
            setTimeout(() => { btn.textContent = label; }, 1500);
        });
    }

    async function investigateWithAgent() {
        const btn = document.getElementById('investigate-btn');
        const resultBlock = document.getElementById('investigation-result');
        const contentEl = document.getElementById('investigation-content');
        if (!btn || !resultBlock || !contentEl) return;

        const currentDateEl = document.getElementById('current-date');
        const previousDateEl = document.getElementById('previous-date');
        const metricSelect = document.getElementById('metric-select');

        const currentDate = currentDateEl ? currentDateEl.value : '';
        const previousDate = previousDateEl ? previousDateEl.value : '';
        const metric = metricSelect ? metricSelect.value : 'total_revenue';

        btn.disabled = true;
        btn.textContent = 'Investigating…';
        resultBlock.classList.remove('hidden');
        contentEl.innerHTML = 'Running agent investigation (this can take several seconds)...';

        try {
            const response = await fetch('/api/investigate/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ metric, current_date: currentDate, previous_date: previousDate })
            });
            const result = await response.json();

            if (result.status !== 'success') {
                throw new Error(result.message || 'Investigation failed');
            }

            const data = result.data;
            if (data.status === 'skipped_no_anomaly') {
                contentEl.innerHTML = 'No anomaly was detected for this date pair -- nothing to investigate.';
            } else if (data.status === 'failed') {
                contentEl.innerHTML = `Investigation failed: ${data.error || 'unknown error'}`;
            } else {
                let html = formatNarrative(data.investigation_summary || 'No summary available.');
                if (data.grounding_failed) {
                    html += '<p class="muted" style="margin-top: 12px; font-size: 13px;">The AI explanation could not be fully verified this run, so this is the deterministic summary instead.</p>';
                }
                contentEl.innerHTML = html;
            }
        } catch (error) {
            contentEl.innerHTML = `Investigation failed: ${error.message}`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Investigate with AI agent';
        }
    }

    function downloadNarrative() {
        const narrativeEl = document.getElementById('narrative');
        if (!narrativeEl) return;
        const narrative = narrativeEl.innerText;
        const blob = new Blob([narrative], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'metricpulse-analysis.txt';
        a.click();
    }

    async function runPipeline(forceAlert) {
        const statusEl = document.getElementById('pipeline-status');
        if (!statusEl) return;
        
        statusEl.textContent = 'Running the pipeline…';
        
        try {
            const metricSelect = document.getElementById('metric-select');
            const metric = metricSelect ? metricSelect.value : 'total_revenue';
            
            const response = await fetch('/api/pipeline/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ metric, force_alert: forceAlert, dry_run: !forceAlert })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                statusEl.textContent = `Finished in ${result.data.duration_seconds.toFixed(2)} s · pipeline ${result.data.pipeline_status} · alert: ${result.data.alert_status || 'none'}`;
                refreshData();
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            statusEl.textContent = `Failed: ${error.message}`;
        }
    }

    // ---------------------------------------------------------------------------------
    // Pending actions (Action Agent API, docs/action-agent-scope.md F5, D8).
    // Every value from the server is escaped: segment names and narratives are untrusted
    // data (N3) and could carry markup. No alert()/confirm()/prompt(): decisions need a
    // reason typed into the card, and results show inline.
    // ---------------------------------------------------------------------------------
    const APPROVER_TOKEN_KEY = 'metricpulse.approverToken';

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => (
            {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    function getApproverToken() {
        try { return sessionStorage.getItem(APPROVER_TOKEN_KEY) || ''; } catch (e) { return ''; }
    }

    function saveApproverToken() {
        const value = document.getElementById('approver-token').value.trim();
        try { sessionStorage.setItem(APPROVER_TOKEN_KEY, value); } catch (e) { /* private mode */ }
        document.getElementById('approver-token').value = '';
        loadActions();
    }

    function clearApproverToken() {
        try { sessionStorage.removeItem(APPROVER_TOKEN_KEY); } catch (e) { /* ignore */ }
        loadActions();
    }

    async function actionsApi(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        const token = getApproverToken();
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const response = await fetch(`/api/actions/${path}`, { ...options, headers });
        let body = {};
        try { body = await response.json(); } catch (e) { /* non-JSON error page */ }
        if (!response.ok || body.status === 'error') {
            const message = body.message || body.detail || `HTTP ${response.status}`;
            throw new Error(message);
        }
        return body.data;
    }

    function setActionsStatus(text, isError) {
        const el = document.getElementById('actions-status');
        el.textContent = text;
        el.className = `text-sm mt-2 ${isError ? 'text-red-600' : 'text-gray-500'}`;
    }

    async function loadActions() {
        const pendingEl = document.getElementById('pending-actions');
        const undoEl = document.getElementById('undoable-actions');
        const logEl = document.getElementById('action-log-rows');
        if (!getApproverToken()) {
            setActionsStatus('Enter the approver token to see and decide proposals.', false);
            pendingEl.innerHTML = undoEl.innerHTML = logEl.innerHTML = '';
            return;
        }
        setActionsStatus('Loading...', false);
        try {
            const [pending, log] = await Promise.all([actionsApi('pending/'), actionsApi('log/?limit=100')]);
            renderPendingActions(pending);
            renderUndoable(log.proposals.filter(p => p.undoable));
            renderActionLog(log.events);
            setActionsStatus(`${pending.length} awaiting a decision. Token accepted.`, false);
        } catch (error) {
            setActionsStatus(error.message, true);
            pendingEl.innerHTML = undoEl.innerHTML = logEl.innerHTML = '';
        }
    }

    function describeTarget(target) {
        if (!target) return 'unknown';
        const owner = target.owner ? `${target.owner.name} <${target.owner.email}>` : '';
        switch (target.kind) {
            case 'notifier': return `message to ${owner} via ${target.channel || 'unconfigured channel'}`;
            case 'github_issue': return `GitHub issue in ${target.repo || 'ACTION_GITHUB_REPO (not set)'}`;
            default: return `${target.kind} (${target.store || ''})${owner ? ', owner ' + owner : ''}`;
        }
    }

    function renderPayload(payload) {
        return Object.entries(payload || {}).map(([key, value]) => {
            const text = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
            return `<div class="mb-2"><div class="text-xs font-semibold text-gray-500 uppercase">${escapeHtml(key)}</div>
                    <pre class="whitespace-pre-wrap break-words text-sm text-gray-800 bg-gray-50 rounded p-2">${escapeHtml(text)}</pre></div>`;
        }).join('');
    }

    function renderPendingActions(items) {
        const el = document.getElementById('pending-actions');
        if (!items.length) {
            el.innerHTML = '<div class="bg-white rounded-2xl border border-gray-100 p-6 text-gray-500 text-sm">No proposals are waiting. New ones come from <code>python -m action_agent.cli propose</code>.</div>';
            return;
        }
        el.innerHTML = items.map(item => {
            const w = item.waiting_on || {};
            const dry = w.dry_run || {};
            const id = escapeHtml(item.proposal_id);
            const errors = (w.policy_errors || []).map(e => `<li>${escapeHtml(e)}</li>`).join('');
            const citations = (item.rationale_citations || []).map(c => `<li>${escapeHtml(typeof c === 'string' ? c : (c.claim || JSON.stringify(c)))}</li>`).join('');
            return `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5" data-proposal="${id}">
                <div class="flex flex-wrap items-center gap-2 mb-2">
                    <span class="text-xs font-semibold bg-blue-50 text-blue-700 px-2 py-1 rounded">${escapeHtml(dry.action_type || item.action_type)}</span>
                    <span class="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded">${escapeHtml(dry.tier)} · ${dry.reversible ? 'reversible' : 'not reversible'}</span>
                    <span class="text-sm text-gray-700">${escapeHtml(item.dataset_id)} / ${escapeHtml(item.metric)} / ${escapeHtml(item.anomaly_date)}</span>
                </div>
                <p class="text-xs text-gray-500 mb-3">Proposed by ${escapeHtml(item.proposer)} · expires ${escapeHtml(w.expires_at || item.expires_at)} · ${escapeHtml(item.proposal_id)}</p>
                ${errors ? `<div class="bg-red-50 text-red-700 text-sm rounded p-3 mb-3"><strong>Your last edit was rejected by policy:</strong><ul class="list-disc ml-5">${errors}</ul></div>` : ''}
                <p class="text-sm text-gray-700 mb-3">${escapeHtml(item.narrative)}</p>
                ${citations ? `<div class="text-sm text-gray-600 mb-3"><strong>Cited evidence</strong><ul class="list-disc ml-5">${citations}</ul></div>` : ''}
                <div class="text-sm mb-1"><strong>Target:</strong> ${escapeHtml(describeTarget(dry.target))}</div>
                <details class="mb-3"><summary class="cursor-pointer text-sm text-blue-600">Exact payload (what will run)</summary><div class="mt-2">${renderPayload(dry.payload)}</div></details>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="params-${id}">Params (edit to change what runs)</label>
                <textarea id="params-${id}" rows="3" class="w-full font-mono text-xs border border-gray-200 rounded-lg p-2 bg-gray-50 mb-2">${escapeHtml(JSON.stringify(dry.params || {}, null, 2))}</textarea>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="reason-${id}">Reason (required to reject)</label>
                <input id="reason-${id}" type="text" class="w-full border border-gray-200 rounded-lg p-2 text-sm bg-gray-50 mb-2">
                <label class="flex items-center gap-2 text-sm text-gray-700 mb-3"><input id="live-${id}" type="checkbox"> Allow effects outside this machine (a real GitHub issue)</label>
                <div class="flex flex-wrap gap-2">
                    <button onclick="decideAction('${id}', 'approve')" class="gradient-bg text-white px-4 py-2 rounded-lg hover:opacity-90 text-sm font-medium">Approve</button>
                    <button onclick="decideAction('${id}', 'edit')" class="bg-white border border-blue-300 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-50 text-sm font-medium">Approve edited params</button>
                    <button onclick="decideAction('${id}', 'reject')" class="bg-white border border-red-300 text-red-700 px-4 py-2 rounded-lg hover:bg-red-50 text-sm font-medium">Reject</button>
                </div>
                <p id="result-${id}" class="text-sm mt-2"></p>
            </div>`;
        }).join('');
    }

    async function decideAction(proposalId, decision) {
        const resultEl = document.getElementById(`result-${proposalId}`);
        const body = {
            reason: document.getElementById(`reason-${proposalId}`).value,
            live: document.getElementById(`live-${proposalId}`).checked,
        };
        if (decision === 'edit') {
            try {
                body.params = JSON.parse(document.getElementById(`params-${proposalId}`).value);
            } catch (e) {
                resultEl.className = 'text-sm mt-2 text-red-600';
                resultEl.textContent = 'Params must be valid JSON.';
                return;
            }
        }
        resultEl.className = 'text-sm mt-2 text-gray-500';
        resultEl.textContent = 'Sending...';
        try {
            const data = await actionsApi(`${proposalId}/${decision}/`, { method: 'POST', body: JSON.stringify(body) });
            if (data.status === 'awaiting_approval') {
                await loadActions();   // re-render with the policy errors from the edit
                return;
            }
            resultEl.className = 'text-sm mt-2 text-green-700';
            resultEl.textContent = `Done: ${data.status}${data.execution ? ` (${JSON.stringify(data.execution)})` : ''}`;
            setTimeout(loadActions, 1200);
        } catch (error) {
            resultEl.className = 'text-sm mt-2 text-red-600';
            resultEl.textContent = error.message;
        }
    }

    function renderUndoable(items) {
        const el = document.getElementById('undoable-actions');
        if (!items.length) {
            el.innerHTML = '<p class="text-sm text-gray-500">None in the recent log.</p>';
            return;
        }
        el.innerHTML = items.map(item => {
            const id = escapeHtml(item.proposal_id);
            return `
            <div class="bg-white rounded-xl border border-gray-100 p-4 flex flex-col md:flex-row md:items-center gap-2">
                <div class="flex-1 text-sm"><strong>${escapeHtml(item.executed_action_type)}</strong> on ${escapeHtml(item.dataset_id)} / ${escapeHtml(item.metric)} / ${escapeHtml(item.anomaly_date)}
                    <span class="text-xs text-gray-500 block">${id}</span></div>
                <input id="undo-reason-${id}" type="text" placeholder="Reason for undo" class="border border-gray-200 rounded-lg p-2 text-sm bg-gray-50">
                <label class="flex items-center gap-1 text-xs text-gray-600"><input id="undo-live-${id}" type="checkbox"> live</label>
                <button onclick="undoAction('${id}')" class="bg-white border border-gray-300 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-50 text-sm">Undo</button>
                <span id="undo-result-${id}" class="text-sm"></span>
            </div>`;
        }).join('');
    }

    async function undoAction(proposalId) {
        const resultEl = document.getElementById(`undo-result-${proposalId}`);
        const body = {
            reason: document.getElementById(`undo-reason-${proposalId}`).value,
            live: document.getElementById(`undo-live-${proposalId}`).checked,
        };
        try {
            const data = await actionsApi(`${proposalId}/undo/`, { method: 'POST', body: JSON.stringify(body) });
            resultEl.className = 'text-sm text-green-700';
            resultEl.textContent = `Undone (${data.outcome})`;
            setTimeout(loadActions, 1200);
        } catch (error) {
            resultEl.className = 'text-sm text-red-600';
            resultEl.textContent = error.message;
        }
    }

    function renderActionLog(events) {
        const el = document.getElementById('action-log-rows');
        if (!events.length) {
            el.innerHTML = '<tr><td colspan="7" class="px-4 py-3 text-gray-500">The log is empty.</td></tr>';
            return;
        }
        el.innerHTML = events.map(e => `
            <tr class="border-t border-gray-100 align-top">
                <td class="px-4 py-2 text-gray-500">${escapeHtml(e.log_id)}</td>
                <td class="px-4 py-2 whitespace-nowrap">${escapeHtml((e.created_at || '').slice(0, 19).replace('T', ' '))}</td>
                <td class="px-4 py-2 font-mono text-xs">${escapeHtml((e.proposal_id || '').slice(0, 8))}</td>
                <td class="px-4 py-2">${escapeHtml(e.event)}</td>
                <td class="px-4 py-2">${escapeHtml(e.actor)}</td>
                <td class="px-4 py-2">${escapeHtml(e.action_type)}</td>
                <td class="px-4 py-2 text-gray-600 break-words">${escapeHtml(e.detail || e.external_id || '')}</td>
            </tr>`).join('');
    }
</script>

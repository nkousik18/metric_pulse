# Static replay site on GitHub Pages (docs/hosting-scope.md §6.3, H1).
# Builds demo/_site from the committed recordings: no secrets, no LLM calls, no database.
# Re-recording is a manual local step (python -m demo.record), committed like any other change.
name: pages

# Publishes on a push to main that touches the site, or by hand. (Held manual-only from 2026-11-12
# until the UI redesign landed; restored 2026-11-13.)
on:
  push:
    branches: [main]
    paths: ['demo/**', 'templates/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the template engine only
        run: pip install "$(grep -i '^django==' requirements.txt)"
      - name: Build the site
        run: python -m demo.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
